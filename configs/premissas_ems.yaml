# Recorte: Energisa Mato Grosso do Sul (EMS, código ANEEL 404), cadastro BDGD de 31/12 de cada ano.
# Uso: python scripts/<script>.py --config configs/premissas_ems.yaml   (ou SEHEALTH_CONFIG=configs/premissas_ems.yaml)
# Tudo o que é de MS fica em subpastas ems: nada aqui escreve em reports/ nem em data/ na raiz.
# O que é igual ao de MT e o que foi rederivado de MS está em docs/decisoes_ems.md (escrito antes de qualquer resultado).
# Valores marcados como ILUSTRATIVO são os de MT, mantidos sem recalibrar.

dados:
  distribuidora: EMS
  cod_aneel: 404             # confere a coluna DIST da BDGD (impede ler o cache de outra distribuidora)
  nome: Energisa Mato Grosso do Sul
  nome_curto: Energisa MS
  # caminhos relativos à raiz do repositório
  cache_bdgd: data/ems/bdgd-cache              # gerado por scripts/00_cache_bdgd.py a partir dos zips locais
  interim_gridrisk: ../distribution-asset-risk/data/ems/interim   # interrupções harmonizadas + crosswalks de MS
  ano_decisao: 2025
  ano_validacao: 2023
  anos_resultado: [2024, 2025]
  anos_paineis: [2021, 2022, 2023, 2024, 2025]
  anos_interrupcoes: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

paths:
  reports: reports/ems
  processed: data/ems/processed
  malha_ibge: ref/ms_ibge.geojson            # IBGE, UF 50

bdgd:
  # snapshots de 31/12 de cada ano, versão mais recente de cada um (id do item no ArcGIS Hub da ANEEL).
  # Fora de propósito: o item avulso EMS_404_2022-10-31_V10 (c3585ae516f340b596617827d60da5ef) e a versão
  # de 17/12/2024 do snapshot de 2023 (b8c585ae35224ac8aa0648587ec61bcb), que não é a mais recente.
  snapshots:
    2018: 5382c59d7cc7494a9a1f8cd865187457   # Energisa_MS_404_2018-12-31_M10_20191023-2327
    2019: b83ad867a35b43189f41b68988f7f0b6   # Energisa_MS_404_2019-12-31_M10_20200323-1921
    2020: fe56dce0714f4b6795d3b23130f5898a   # Energisa_MS_404_2020-12-31_M10_20210628-1527
    2021: 933af69c57dd41ea8f6048118b8d07e7   # Energisa_MS_404_2021-12-31_V10_20230315-1800
    2022: ff5242147c86428e88971941a35c7cd1   # Energisa_MS_404_2022-12-31_V11_20240422-2036
    2023: 975f18dfdb0c479cb237893c5b296ca9   # Energisa_MS_404_2023-12-31_V11_20250923-1616
    2024: b7fad4cd388845a08a01643599ec747b   # Energisa_MS_404_2024-12-31_V11_20250730-1637
    2025: 9a1ce360865f4358b31e9fb2d016aac9   # Energisa_MS_404_2025-12-31_V11_20260830-0339
  # Zips já baixados (bdgd_<ano>_<item>.gdb.zip), lidos sem extrair. Informe a pasta por --zips ou por
  # SEHEALTH_BDGD_ZIPS (um caminho de outra máquina não deve ficar neste arquivo público).
  zips_locais: null
  # Só os snapshots V10/V11 têm as camadas UNTRAT/EQTRAT (2018 a 2020 são M10: UNTRS/EQTRS, CTMT.NOM)
  anos_cache: [2021, 2022, 2023, 2024, 2025]
  # Só as camadas que o pipeline lê (o cache de MT guarda mais, sem uso aqui)
  camadas: [UNSEMT, UNTRAT, EQTRAT, SUB, CTMT]
  com_geometria: [UNSEMT, SUB, UNTRAT]
  topologia:
    anos: [2021, 2022, 2023, 2024, 2025]
    camadas:
      SSDMT: [COD_ID, PAC_1, PAC_2, CTMT, COMP, FAS_CON, TIP_CND, SUB, CONJ]
    ucs: false

eletrico:
  fator_potencia: 0.92       # ILUSTRATIVO (igual a MT)
  fator_carga_se: 0.72       # ILUSTRATIVO (igual a MT); só há energia mensal em MS também
  fator_carga_sensibilidade: [0.62, 0.82]
  sobrecarga_emergencia: 1.0
  # Rederivados de MS (docs/decisoes_ems.md, seções 3 a 5):
  tensoes_secundario_mt: ["49", "72"]   # 13,8 kV e 34,5 kV; o código 38 de MT não existe em MS; 82 (69 kV) supre outras SEs
  se_do_alimentador: ctmt               # SE = CTMT.SUB (bate com a SE gravada nas interrupções de 2026 em 99,7%); MT: trafo
  vinculo_alimentador: se               # coerente = a SE tem trafo de MT na tensão do circuito; MT: o trafo apontado
  capacidade_emergencia: nominal        # os estágios F01/F02 de 2025 são 1,25x e 1,5x em 100% dos trafos; MT: estagios
  excluir_se_sem_codigo: true           # 5 a 8 circuitos e 5 a 7 trafos de 2023 a 2025 têm SE em branco (seção 13)
  cobertura_minima_vinculo: 0.8

# Portas de qualidade (a) e (b), pré-registradas em docs/decisoes_ems.md, seção 2
qualidade:
  idade_trafo_confiavel: false           # DAT_CON do mesmo trafo muda entre cadastros: idade_anos não entra na saúde
  rank_entre_carregamento_confiavel: true   # coluna extra no índice (seção 13); o ranking principal não muda
  crescimento_energia_confiavel: false   # a energia dos circuitos oscila entre cadastros (seção 5.1): sem crescimento_aa
  validacao: {min_ses_com_evento: 30, min_eventos: 200}

# Sensibilidades declaradas de antemão (seção 2.5): saem ao lado do resultado principal e nunca o substituem
sensibilidades:
  estagios_cadastrados: {capacidade_emergencia: estagios}                       # capacidade pelo maior estágio de ventilação
  vinculo_regra_mt: {se_do_alimentador: trafo, vinculo_alimentador: trafo}      # SE e vínculo pelo trafo apontado

validacao:
  anos_diagnostico_ampliacao: [2021, 2022, 2023]
  ano_disjuntor: 2026
  elemento_disjuntor: DISJUNTOR
  # só entram na validação as SEs do índice cujo código existe no snapshot em que o resultado é medido
  so_ses_presentes_no_resultado: true
  # porta (c): mínimos para publicar a comparação com as ampliações reais (docs/decisoes_ems.md, seção 2.4)
  portas_ampliacao: {min_sinalizadas: 10, min_nao_sinalizadas: 10, min_pct_pareadas: 80}

eventos:
  min_alimentadores_evento_se: 3

scores:
  utilizacao_pico_pontuado: {bom: 0.50, ruim: 1.00}
  deficit_n1_pontuado: {bom: 0.0, ruim: 0.5}
  crescimento_aa: {bom: 0.0, ruim: 0.10}
  perdas_z: {bom: 0.0, ruim: 2.5}
  eventos_se_por_100k_uc: {bom: 0.0, ruim: 20.0}
  n_uc: {bom: 5000, ruim: 100000, log: true}
  energia_gwh: {bom: 20, ruim: 500, log: true}
  frac_uc_sem_transferencia: {bom: 0.0, ruim: 1.0}
  frac_municipio: {bom: 0.0, ruim: 1.0}

pesos:
  saude:
    utilizacao_pico_pontuado: 0.375
    deficit_n1_pontuado: 0.375
    perdas_z: 0.0625
    eventos_se_por_100k_uc: 0.1875
  criticidade:
    n_uc: 0.45
    energia_gwh: 0.20
    frac_uc_sem_transferencia: 0.20
    frac_municipio: 0.15

matriz:
  corte_saude: 50
  corte_criticidade: 50

valor:
  # R$ por consumidor-hora de MS e rótulo da origem do efeito: lidos do valor.json do automation-impact de MS
  # (nunca os de MT, R$ 5,94 e R$ 1,93).
  valor_json: ../automation-impact/reports/ems/valor.json
  custo_ens_rs_mwh: 7000
  taxa_falha_trafo_ano: 0.01
  horas_reposicao: 72
  custo_ampliacao_rs_mva: 200000
  vida_util_anos: 35
  taxa_desconto: 0.08
